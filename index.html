<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      grid-template-rows: 56px 1fr;
      gap: 14px;
      padding: 14px;
    }
    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: #1c1c1c;
      border-radius: 14px;
    }
    .header h1 { font-size: 1.5rem; font-weight: 600; }
    .time { font-size: 1.7rem; font-weight: 500; }
    .calendars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      height: 100%;
    }
    .calendar-box, .side-box {
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .calendar-box h2, .side-box h2 {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .events-list {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .side {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      height: 100%;
    }
    .weather {
      padding: 20px;
      text-align: center;
    }
    .weather .temp {
      font-size: 3.4rem;
      font-weight: 300;
    }
    .weather .desc {
      font-size: 1.15rem;
      opacity: 0.8;
      margin-top: 6px;
    }
    .departures {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }
    .departure {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 1.1rem;
    }
    .line {
      font-weight: 700;
      color: #4fc3f7;
      min-width: 40px;
    }
    .note {
      opacity: 0.6;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Family Dashboard</h1>
    <div class="time" id="clock">--:--</div>
  </div>

  <div class="calendars">
    <div class="calendar-box">
      <h2>Aksel's Calendar</h2>
      <div class="events-list" id="aksel-events">
        <div class="note">Calendars coming back soon...</div>
      </div>
    </div>
    <div class="calendar-box">
      <h2>Ivar's Calendar</h2>
      <div class="events-list" id="ivar-events">
        <div class="note">Calendars coming back soon...</div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="side-box">
      <h2>Weather – Laajasalo</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>
    <div class="side-box">
      <h2>Bus
