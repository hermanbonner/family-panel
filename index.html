<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 14px;
      padding: 14px;
    }
    .calendars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .calendar-box, .side-box {
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .calendar-box h2, .side-box h2 {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .events-list {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .side {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .datetime {
      padding: 18px 16px;
      text-align: center;
    }
    .datetime .time {
      font-size: 3.1rem;
      font-weight: 300;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }
    .datetime .weekday {
      font-size: 1.35rem;
      margin-top: 8px;
      font-weight: 500;
    }
    .datetime .date {
      font-size: 1.15rem;
      opacity: 0.85;
      margin-top: 2px;
    }
    .datetime .holiday {
      font-size: 0.95rem;
      color: #4fc3f7;
      margin-top: 8px;
      font-weight: 500;
    }
    .weather {
      padding: 18px 16px;
      text-align: center;
    }
    .weather .temp {
      font-size: 3.2rem;
      font-weight: 300;
    }
    .weather .desc {
      font-size: 1.15rem;
      opacity: 0.8;
      margin-top: 6px;
    }
    .departures {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      min-height: 0;
    }
    .departure {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 1.1rem;
    }
    .line {
      font-weight: 700;
      color: #4fc3f7;
      min-width: 40px;
    }
    .note {
      opacity: 0.6;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <div class="calendars">
    <div class="calendar-box">
      <h2>Aksel's Calendar</h2>
      <div class="events-list" id="aksel-events">
        <div class="note">Calendars coming back soon...</div>
      </div>
    </div>
    <div class="calendar-box">
      <h2>Ivar's Calendar</h2>
      <div class="events-list" id="ivar-events">
        <div class="note">Calendars coming back soon...</div>
      </div>
    </div>
  </div>

  <div class="side">
    <!-- Time & Date + Holiday -->
    <div class="side-box">
      <div class="datetime" id="datetime">
        <div class="time" id="clock">--:--</div>
        <div class="weekday" id="weekday">--</div>
        <div class="date" id="date">--</div>
        <div class="holiday" id="holiday"></div>
      </div>
    </div>

    <div class="side-box">
      <h2>Weather – Laajasalo</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Bus – Stop 1491171</h2>
      <div class="departures" id="departures">
        <div class="note">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    // Fixed-date holidays (Flag days + public holidays)
    const fixedHolidays = {
      "01-01": "New Year's Day",
      "01-06": "Epiphany",
      "02-05": "Runeberg Day",
      "02-28": "Kalevala Day",
      "03-19": "Minna Canth Day (Equality Day)",
      "04-09": "Mikael Agricola Day",
      "04-27": "National Veterans' Day",
      "05-01": "May Day",
      "05-09": "Europe Day",
      "05-12": "J. V. Snellman Day",
      "06-04": "Defence Forces Flag Day",
      "07-06": "Eino Leino Day",
      "10-01": "Miina Sillanpää Day",
      "10-10": "Aleksis Kivi Day",
      "11-06": "Swedish Day",
      "12-06": "Independence Day",
      "12-08": "Jean Sibelius Day",
      "12-24": "Christmas Eve",
      "12-25": "Christmas Day",
      "12-26": "Boxing Day"
    };

    // Moving holidays (calculated each year)
    function getMovingHolidays(year) {
      const result = {};

      // Easter calculation (Anonymous Gregorian algorithm)
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      const easter = new Date(year, month - 1, day);

      const addDays = (date, days) => {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
      };

      const formatKey = (d) => `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      // Easter-related
      result[formatKey(addDays(easter, -2))] = "Good Friday";
      result[formatKey(easter)] = "Easter Sunday";
      result[formatKey(addDays(easter, 1))] = "Easter Monday";
      result[formatKey(addDays(easter, 39))] = "Ascension Day";
      result[formatKey(addDays(easter, 49))] = "Pentecost";

      // Mother's Day – second Sunday in May
      const may1 = new Date(year, 4, 1);
      const motherDay = new Date(year, 4, 1 + ((7 - may1.getDay()) % 7) + 7);
      result[formatKey(motherDay)] = "Mother's Day";

      // Father's Day – second Sunday in November
      const nov1 = new Date(year, 10, 1);
      const fatherDay = new Date(year, 10, 1 + ((7 - nov1.getDay()) % 7) + 7);
      result[formatKey(fatherDay)] = "Father's Day";

      // Midsummer Day – Saturday between 20–26 June
      for (let d = 20; d <= 26; d++) {
        const mid = new Date(year, 5, d);
        if (mid.getDay() === 6) {
          result[formatKey(mid)] = "Midsummer Day";
          result[formatKey(addDays(mid, -1))] = "Midsummer Eve";
          break;
        }
      }

      // Finnish Nature Day – last Saturday in August
      const aug31 = new Date(year, 7, 31);
      const natureDay = new Date(year, 7, 31 - ((aug31.getDay() + 1) % 7));
      result[formatKey(natureDay)] = "Finnish Nature Day";

      // All Saints' Day – Saturday between 31 Oct – 6 Nov
      for (let d = 31; d <= 37; d++) {
        const check = new Date(year, 9, d); // start from Oct 31
        if (check.getDay() === 6) {
          result[formatKey(check)] = "All Saints' Day";
          break;
        }
      }

      return result;
    }

    function updateDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const key = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

      // Time (24h)
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      // Weekday
      document.getElementById('weekday').textContent = now.toLocaleDateString('en-GB', {
        weekday: 'long'
      });

      // Month + Day
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', {
        month: 'long',
        day: 'numeric'
      });

      // Holiday
      const allHolidays = { ...fixedHolidays, ...getMovingHolidays(year) };
      const holidayEl = document.getElementById('holiday');
      if (allHolidays[key]) {
        holidayEl.textContent = allHolidays[key];
        holidayEl.style.display = 'block';
      } else {
        holidayEl.textContent = '';
        holidayEl.style.display = 'none';
      }
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();

    // WEATHER
    // WEATHER with icons
async function loadWeather() {
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=60.1752&longitude=25.0309&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FHelsinki&forecast_days=4');
    const data = await res.json();

    const temp = Math.round(data.current.temperature_2m);
    const feels = Math.round(data.current.apparent_temperature);
    const wind = Math.round(data.current.wind_speed_10m);
    const humidity = data.current.relative_humidity_2m;
    const code = data.current.weather_code;

    // Weather icons + descriptions
    const weatherMap = {
      0:  { icon: "☀️",  desc: "Clear" },
      1:  { icon: "🌤️", desc: "Mainly clear" },
      2:  { icon: "⛅",  desc: "Partly cloudy" },
      3:  { icon: "☁️",  desc: "Overcast" },
      45: { icon: "🌫️", desc: "Fog" },
      48: { icon: "🌫️", desc: "Fog" },
      51: { icon: "🌦️", desc: "Light drizzle" },
      53: { icon: "🌦️", desc: "Drizzle" },
      55: { icon: "🌧️", desc: "Dense drizzle" },
      61: { icon: "🌧️", desc: "Slight rain" },
      63: { icon: "🌧️", desc: "Rain" },
      65: { icon: "🌧️", desc: "Heavy rain" },
      71: { icon: "🌨️", desc: "Slight snow" },
      73: { icon: "❄️",  desc: "Snow" },
      75: { icon: "❄️",  desc: "Heavy snow" },
      80: { icon: "🌦️", desc: "Rain showers" },
      81: { icon: "🌧️", desc: "Showers" },
      82: { icon: "🌧️", desc: "Heavy showers" },
      95: { icon: "⛈️",  desc: "Thunderstorm" },
      96: { icon: "⛈️",  desc: "Thunderstorm" }
    };

    const current = weatherMap[code] || { icon: "🌡️", desc: "Weather" };

    // 3-day forecast
    let forecast = '';
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    for (let i = 1; i <= 3; i++) {
      const d = new Date(data.daily.time[i]);
      const day = days[d.getDay()];
      const max = Math.round(data.daily.temperature_2m_max[i]);
      const min = Math.round(data.daily.temperature_2m_min[i]);
      const dayCode = data.daily.weather_code[i];
      const dayInfo = weatherMap[dayCode] || { icon: "🌡️", desc: "" };

      forecast += `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #333; font-size:0.95rem;">
          <span style="width:40px;">${day}</span>
          <span style="font-size:1.3rem; width:36px; text-align:center;">${dayInfo.icon}</span>
          <span style="flex:1; opacity:0.8; padding-left:6px;">${dayInfo.desc}</span>
          <span>${min}° / ${max}°</span>
        </div>`;
    }

    document.getElementById('weather').innerHTML = `
      <div class="temp">${temp}°</div>
      <div class="desc" style="font-size:1.4rem; margin-top:4px;">
        ${current.icon} ${current.desc}
      </div>
      <div style="margin-top:12px; font-size:1rem; opacity:0.85; line-height:1.5;">
        Feels ${feels}° · Wind ${wind} km/h<br>
        Humidity ${humidity}%
      </div>
      <div style="margin-top:14px;">
        ${forecast}
      </div>
    `;
  } catch (e) {
    document.getElementById('weather').innerHTML = `
      <div class="temp">--°</div>
      <div class="desc">Weather unavailable</div>
    `;
  }
}

    // BUS
    async function loadBus() {
      try {
        const res = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': 'fb7596a828844a87933c2229abb55c31'
          },
          body: JSON.stringify({
            query: `{ stop(id: "HSL:1491171") { stoptimesWithoutPatterns(numberOfDepartures: 4) { realtime realtimeDeparture scheduledDeparture departureDelay serviceDay headsign trip { route { shortName } } } } }`
          })
        });

        const json = await res.json();
        const list = json.data?.stop?.stoptimesWithoutPatterns || [];

        if (list.length === 0) {
          document.getElementById('departures').innerHTML = '<div class="note">No departures</div>';
          return;
        }

        let html = '';
        list.forEach(st => {
          const secs = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          const time = new Date((st.serviceDay + secs) * 1000);
          let t = time.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
          const delay = Math.round((st.departureDelay || 0) / 60);
          if (delay >= 1) t += ` <span style="color:#ff6b6b">(+${delay})</span>`;

          html += `<div class="departure">
            <span class="line">${st.trip?.route?.shortName || '?'}</span>
            <span>${st.headsign || ''}</span>
            <span>${t}</span>
          </div>`;
        });

        document.getElementById('departures').innerHTML = html;
      } catch (e) {
        document.getElementById('departures').innerHTML = '<div class="note">Could not load bus</div>';
      }
    }
    loadBus();
    setInterval(loadBus, 60 * 1000);
  </script>
</body>
</html>
