<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
   * { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f0f0f;
  color: #eee;
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  grid-template-rows: 56px 1fr;
  gap: 14px;
  padding: 14px;
}

.header {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  background: #1c1c1c;
  border-radius: 14px;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.time {
  font-size: 1.7rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.calendars {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 14px;
  height: 100%;
  min-height: 0;
}

.calendar-box, .side-box {
  background: #1c1c1c;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.calendar-box h2, .side-box h2 {
  font-size: 1.05rem;
  font-weight: 600;
  padding: 12px 16px;
  background: #252525;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

iframe {
  border: none;
  width: 100%;
  flex: 1;
  background: white;
  min-height: 0;
}

.side {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 14px;
  height: 100%;
  min-height: 0;
}

.weather {
  padding: 24px 16px;
  text-align: center;
}

.weather .temp {
  font-size: 3.8rem;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -1px;
}

.weather .desc {
  font-size: 1.2rem;
  opacity: 0.75;
  margin-top: 8px;
}

.departures {
  flex: 1;
  padding: 8px 16px 16px;
  overflow-y: auto;
  min-height: 0;
}

.departure {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid #2a2a2a;
  font-size: 1.15rem;
}

.departure:last-child {
  border-bottom: none;
}

.line {
  font-weight: 700;
  min-width: 48px;
  color: #4fc3f7;
  font-size: 1.2rem;
}

.note {
  font-size: 1rem;
  opacity: 0.55;
  padding: 20px 12px;
  text-align: center;
} 
  </style>
</head>
<body>
  <div class="header">
    <h1>Family Dashboard</h1>
    <div class="time" id="clock"></div>
  </div>

  <div class="calendars">
    <div class="calendar-box">
      <h2>Herman's Calendar</h2>
      <iframe src="https://calendar.google.com/calendar/embed?src=YOUR_CALENDAR_1_ID%40group.calendar.google.com&ctz=Europe%2FHelsinki&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>
    <div class="calendar-box">
      <h2>Family Calendar</h2>
      <iframe src="https://calendar.google.com/calendar/embed?src=YOUR_CALENDAR_2_ID%40group.calendar.google.com&ctz=Europe%2FHelsinki&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>
  </div>

  <div class="side">
    <div class="side-box">
      <h2>Weather – Helsinki</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Bus 84 – Rudolfintie</h2>
      <div class="departures" id="departures">
        <div class="note">Loading departures...</div>
      </div>
    </div>
  </div>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fi-FI', {
        hour: '2-digit', minute: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Weather
    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=60.17&longitude=24.94&current=temperature_2m,weather_code&timezone=Europe%2FHelsinki');
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;

        const descriptions = {
          0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
          45: "Fog", 48: "Fog", 51: "Light drizzle", 61: "Rain", 63: "Rain",
          71: "Snow", 73: "Snow", 80: "Rain showers", 95: "Thunderstorm"
        };

        document.getElementById('weather').innerHTML = `
          <div class="temp">${temp}°</div>
          <div class="desc">${descriptions[code] || "Weather"}</div>
        `;
      } catch (e) {
        document.getElementById('weather').innerHTML = `<div class="temp">--°</div><div class="desc">Weather unavailable</div>`;
      }
    }
    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);

    // HSL Departures – FIXED version
    async function loadDepartures() {
      const container = document.getElementById('departures');
      const API_KEY = 'fb7596a828844a87933c2229abb55c31';

      const query = `
      {
        stop(id: "HSL:1491113") {
          name
          stoptimesWithoutPatterns(numberOfDepartures: 8) {
            realtime
            realtimeDeparture
            scheduledDeparture
            serviceDay
            headsign
            trip {
              route {
                shortName
              }
            }
          }
        }
      }`;

      try {
        const res = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': API_KEY
          },
          body: JSON.stringify({ query })
        });

        const json = await res.json();
        
        if (json.errors) {
          console.error(json.errors);
          container.innerHTML = '<div class="note">API Error – check console</div>';
          return;
        }

        const stoptimes = json.data?.stop?.stoptimesWithoutPatterns || [];

        if (stoptimes.length === 0) {
          container.innerHTML = '<div class="note">No upcoming departures</div>';
          return;
        }

        let html = '';
        const now = Math.floor(Date.now() / 1000);

        stoptimes.forEach(st => {
          // Correct calculation: serviceDay + seconds since midnight
          const departureSeconds = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          const absoluteTime = st.serviceDay + departureSeconds;
          const minutes = Math.round((absoluteTime - now) / 60);

          let timeText;
          if (minutes <= 0) timeText = 'Now';
          else if (minutes < 60) timeText = `${minutes} min`;
          else timeText = `${Math.floor(minutes / 60)}h ${minutes % 60}m`;

          const line = st.trip?.route?.shortName || '?';
          const dest = st.headsign || '';

          html += `
            <div class="departure">
              <span class="line">${line}</span>
              <span>${dest}</span>
              <span>${timeText}</span>
            </div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="note">Could not load departures</div>';
      }
    }

    loadDepartures();
    setInterval(loadDepartures, 60 * 1000);
  </script>
</body>
</html>
