<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      grid-template-rows: 56px 1fr;
      gap: 14px;
      padding: 14px;
    }

    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: #1c1c1c;
      border-radius: 14px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .time {
      font-size: 1.7rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .calendars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .calendar-box, .side-box {
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .calendar-box h2, .side-box h2 {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .events-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 16px;
      font-size: 1.05rem;
    }

    .section-header {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4fc3f7;
      margin: 14px 0 8px 0;
      opacity: 0.9;
    }

    .section-header:first-child {
      margin-top: 0;
    }

    .event-item {
      padding: 9px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .event-time {
      font-weight: 600;
      color: #4fc3f7;
      margin-bottom: 2px;
      font-size: 0.98rem;
    }

    .event-title {
      font-size: 1.05rem;
    }

    .event-location {
      font-size: 0.88rem;
      opacity: 0.65;
      margin-top: 2px;
    }

    .side {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .weather {
      padding: 18px 16px 16px;
      text-align: center;
    }

    .weather .temp {
      font-size: 3.6rem;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -1px;
    }

    .weather .desc {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-top: 6px;
    }

    .departures {
      flex: 1;
      padding: 8px 16px 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .departure {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 1.15rem;
    }

    .departure:last-child {
      border-bottom: none;
    }

    .line {
      font-weight: 700;
      min-width: 48px;
      color: #4fc3f7;
      font-size: 1.2rem;
    }

    .note {
      font-size: 0.95rem;
      opacity: 0.55;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Family Dashboard</h1>
    <div class="time" id="clock"></div>
  </div>

  <div class="calendars">
    <div class="calendar-box">
      <h2>Aksel's Calendar</h2>
      <div id="aksel-events" class="events-list">
        <div class="note">Loading...</div>
      </div>
    </div>

    <div class="calendar-box">
      <h2>Ivar's Calendar</h2>
      <div id="ivar-events" class="events-list">
        <div class="note">Loading...</div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="side-box">
      <h2>Weather – Laajasalo</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Bus – Stop 1491171</h2>
      <div class="departures" id="departures">
        <div class="note">Loading departures...</div>
      </div>
    </div>
  </div>

  <script>
    // ===== CLOCK =====
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fi-FI', {
        hour: '2-digit', minute: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ===== WEATHER =====
    async function loadWeather() {
      const weatherEl = document.getElementById('weather');
      try {
        const url = 'https://api.open-meteo.com/v1/forecast' +
          '?latitude=60.1752&longitude=25.0309' +
          '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m' +
          '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
          '&timezone=Europe%2FHelsinki&forecast_days=4';

        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather API error');
        const data = await res.json();

        const current = data.current;
        const daily = data.daily;

        const temp = Math.round(current.temperature_2m);
        const feels = Math.round(current.apparent_temperature);
        const wind = Math.round(current.wind_speed_10m);
        const humidity = current.relative_humidity_2m;
        const code = current.weather_code;

        const weatherInfo = {
          0: { desc: "Clear", icon: "☀️" },
          1: { desc: "Mainly clear", icon: "🌤️" },
          2: { desc: "Partly cloudy", icon: "⛅" },
          3: { desc: "Overcast", icon: "☁️" },
          45: { desc: "Fog", icon: "🌫️" }, 48: { desc: "Fog", icon: "🌫️" },
          51: { desc: "Light drizzle", icon: "🌦️" }, 53: { desc: "Drizzle", icon: "🌦️" }, 55: { desc: "Dense drizzle", icon: "🌧️" },
          61: { desc: "Slight rain", icon: "🌧️" }, 63: { desc: "Rain", icon: "🌧️" }, 65: { desc: "Heavy rain", icon: "🌧️" },
          71: { desc: "Slight snow", icon: "🌨️" }, 73: { desc: "Snow", icon: "❄️" }, 75: { desc: "Heavy snow", icon: "❄️" },
          80: { desc: "Rain showers", icon: "🌦️" }, 81: { desc: "Showers", icon: "🌧️" }, 82: { desc: "Heavy showers", icon: "🌧️" },
          95: { desc: "Thunderstorm", icon: "⛈️" }, 96: { desc: "Thunderstorm", icon: "⛈️" }
        };

        const currentInfo = weatherInfo[code] || { desc: "Weather", icon: "🌡️" };

        let forecastHtml = '';
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        for (let i = 1; i <= 3; i++) {
          const date = new Date(daily.time[i] + 'T12:00:00');
          const dayName = days[date.getDay()];
          const max = Math.round(daily.temperature_2m_max[i]);
          const min = Math.round(daily.temperature_2m_min[i]);
          const info = weatherInfo[daily.weather_code[i]] || { desc: "", icon: "🌡️" };

          forecastHtml += `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #333;">
              <span style="width:42px;">${dayName}</span>
              <span style="width:32px;text-align:center;font-size:1.25rem;">${info.icon}</span>
              <span style="flex:1;opacity:0.75;font-size:0.95rem;padding-left:6px;">${info.desc}</span>
              <span>${min}° / ${max}°</span>
            </div>`;
        }

        weatherEl.innerHTML = `
          <div class="temp">${temp}°</div>
          <div class="desc">${currentInfo.icon} ${currentInfo.desc}</div>
          <div style="margin-top:12px;font-size:1.05rem;opacity:0.85;line-height:1.5;">
            Feels like ${feels}° · Wind ${wind} km/h<br>Humidity ${humidity}%
          </div>
          <div style="margin-top:16px;font-size:0.95rem;">${forecastHtml}</div>
        `;
      } catch (e) {
        console.error(e);
        weatherEl.innerHTML = `<div class="temp">--°</div><div class="desc">Weather unavailable</div>`;
      }
    }
    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);

    // ===== ICS PARSER (with end time) =====
    function parseICS(icsText) {
      const events = [];
      const blocks = icsText.split('BEGIN:VEVENT');

      for (let i = 1; i < blocks.length; i++) {
        const block = blocks[i];
        const summary = (block.match(/SUMMARY:(.*)/) || [])[1]?.trim() || 'Event';
        const location = (block.match(/LOCATION:(.*)/) || [])[1]?.trim() || '';
        const dtstart = (block.match(/DTSTART[^:]*:(.*)/) || [])[1]?.trim();
        const dtend   = (block.match(/DTEND[^:]*:(.*)/) || [])[1]?.trim();

        if (!dtstart) continue;

        const parseDate = (str) => {
          if (!str) return null;
          if (str.length === 8) {
            return new Date(str.slice(0,4), parseInt(str.slice(4,6))-1, str.slice(6,8));
          }
          const cleaned = str.replace('Z', '');
          return new Date(
            cleaned.slice(0,4),
            parseInt(cleaned.slice(4,6))-1,
            cleaned.slice(6,8),
            cleaned.slice(9,11) || 0,
            cleaned.slice(11,13) || 0
          );
        };

        events.push({
          summary,
          location,
          start: parseDate(dtstart),
          end: parseDate(dtend)
        });
      }
      return events;
    }

    function formatTime(date) {
      if (!date) return '';
      return date.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
    }

    // ===== LOAD FULL DAY VIEW FOR ONE CHILD =====
    async function loadChildSchedule(containerId, schoolUrl, soccerUrl) {
      const container = document.getElementById(containerId);

      try {
        // Fetch both calendars in parallel
        const [schoolRes, soccerRes] = await Promise.all([
          fetch(schoolUrl),
          fetch(soccerUrl.replace('webcal://', 'https://'))
        ]);

        if (!schoolRes.ok) throw new Error('School ICS failed');
        // Soccer may fail silently

        const schoolText = await schoolRes.text();
        const schoolEvents = parseICS(schoolText);

        let soccerEvents = [];
        if (soccerRes.ok) {
          const soccerText = await soccerRes.text();
          soccerEvents = parseICS(soccerText);
        }

        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const todayEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const tomorrowStart = todayEnd;
        const tomorrowEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2);

        // Today's school events
        const todaySchool = schoolEvents
          .filter(e => e.start >= todayStart && e.start < todayEnd)
          .sort((a, b) => a.start - b.start);

        // Today's soccer events
        const todaySoccer = soccerEvents
          .filter(e => e.start >= todayStart && e.start < todayEnd)
          .sort((a, b) => a.start - b.start);

        // First school event tomorrow
        const tomorrowSchool = schoolEvents
          .filter(e => e.start >= tomorrowStart && e.start < tomorrowEnd)
          .sort((a, b) => a.start - b.start);

        let html = '';

        // === SCHOOL ===
        html += `<div class="section-header">School</div>`;
        if (todaySchool.length === 0) {
          html += `<div class="note">No more school today</div>`;
        } else {
          todaySchool.forEach(ev => {
            const timeRange = ev.end
              ? `${formatTime(ev.start)} – ${formatTime(ev.end)}`
              : formatTime(ev.start);

            html += `
              <div class="event-item">
                <div class="event-time">${timeRange}</div>
                <div class="event-title">${ev.summary}</div>
                ${ev.location ? `<div class="event-location">${ev.location}</div>` : ''}
              </div>`;
          });
        }

        // === SOCCER ===
        html += `<div class="section-header">Soccer</div>`;
        if (todaySoccer.length === 0) {
          html += `<div class="note">No soccer today</div>`;
        } else {
          todaySoccer.forEach(ev => {
            const timeRange = ev.end
              ? `${formatTime(ev.start)} – ${formatTime(ev.end)}`
              : formatTime(ev.start);

            html += `
              <div class="event-item">
                <div class="event-time">${timeRange}</div>
                <div class="event-title">${ev.summary}</div>
                ${ev.location ? `<div class="event-location">${ev.location}</div>` : ''}
              </div>`;
          });
        }

        // === FIRST THING TOMORROW ===
        html += `<div class="section-header">First Thing Tomorrow</div>`;
        if (tomorrowSchool.length === 0) {
          html += `<div class="note">No School</div>`;
        } else {
          const first = tomorrowSchool[0];
          const timeRange = first.end
            ? `${formatTime(first.start)} – ${formatTime(first.end)}`
            : formatTime(first.start);

          html += `
            <div class="event-item">
              <div class="event-time">${timeRange}</div>
              <div class="event-title">${first.summary}</div>
              ${first.location ? `<div class="event-location">${first.location}</div>` : ''}
            </div>`;
        }

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="note">Could not load schedule</div>`;
      }
    }

    // Aksel
    const AKSEL_SCHOOL = 'https://yvkoulut.inschool.fi/schedule/export/students/167030/Wilma.ics?token=04167030xca951b62f2c0ffca02025635a42a812c&p=28&f=56&tstamp=1786682462';
    const AKSEL_SOCCER = 'https://id.myclub.fi/flow/calendar_subscriptions/46384.ics?token=1900f8ae39d12415a5d741d2a6d739d9edc271ad';

    // Ivar
    const IVAR_SCHOOL  = 'https://helsinki.inschool.fi/schedule/export/students/629788/Wilma.ics?token=04629788xbfa1cd9f9404e2a8196048f4b00d04db&p=28&f=56&tstamp=1786682566';
    const IVAR_SOCCER  = 'https://id.myclub.fi/flow/calendar_subscriptions/46330.ics?token=d7f8d00e0516158b87fbe67a4f2916a961383c18';

    function refreshSchedules() {
      loadChildSchedule('aksel-events', AKSEL_SCHOOL, AKSEL_SOCCER);
      loadChildSchedule('ivar-events',  IVAR_SCHOOL,  IVAR_SOCCER);
    }

    refreshSchedules();
    setInterval(refreshSchedules, 15 * 60 * 1000);

    // ===== BUS DEPARTURES =====
    async function loadDepartures() {
      const container = document.getElementById('departures');
      const API_KEY = 'fb7596a828844a87933c2229abb55c31';

      const query = `{
        stop(id: "HSL:1491171") {
          stoptimesWithoutPatterns(numberOfDepartures: 4) {
            realtime realtimeDeparture scheduledDeparture departureDelay serviceDay headsign
            trip { route { shortName } }
          }
        }
      }`;

      try {
        const res = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': API_KEY
          },
          body: JSON.stringify({ query })
        });

        const json = await res.json();
        const stoptimes = json.data?.stop?.stoptimesWithoutPatterns || [];

        if (stoptimes.length === 0) {
          container.innerHTML = '<div class="note">No upcoming departures</div>';
          return;
        }

        let html = '';
        stoptimes.forEach(st => {
          const secs = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          const abs = st.serviceDay + secs;
          const date = new Date(abs * 1000);
          let timeText = date.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });

          const delayMin = Math.round((st.departureDelay || 0) / 60);
          if (delayMin >= 1) {
            timeText += ` <span style="color:#ff6b6b;font-size:0.9rem;">(+${delayMin})</span>`;
          }

          html += `
            <div class="departure">
              <span class="line">${st.trip?.route?.shortName || '?'}</span>
              <span>${st.headsign || ''}</span>
              <span>${timeText}</span>
            </div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="note">Could not load departures</div>';
      }
    }

    loadDepartures();
    setInterval(loadDepartures, 60 * 1000);
  </script>
</body>
</html>
