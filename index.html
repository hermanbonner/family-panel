<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      grid-template-rows: 56px 1fr;
      gap: 14px;
      padding: 14px;
    }

    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: #1c1c1c;
      border-radius: 14px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .time {
      font-size: 1.7rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .calendars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .calendar-box, .side-box {
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .calendar-box h2, .side-box h2 {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    iframe {
      border: none;
      width: 100%;
      flex: 1;
      background: white;
      min-height: 0;
    }

    .events-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-size: 1.05rem;
    }

    .event-item {
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .event-time {
      font-weight: 600;
      color: #4fc3f7;
      margin-bottom: 3px;
    }

    .event-title {
      font-size: 1.05rem;
    }

    .event-location {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 2px;
    }

    .side {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .weather {
      padding: 18px 16px 16px;
      text-align: center;
    }

    .weather .temp {
      font-size: 3.6rem;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -1px;
    }

    .weather .desc {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-top: 6px;
    }

    .departures {
      flex: 1;
      padding: 8px 16px 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .departure {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 1.15rem;
    }

    .departure:last-child {
      border-bottom: none;
    }

    .line {
      font-weight: 700;
      min-width: 48px;
      color: #4fc3f7;
      font-size: 1.2rem;
    }

    .note {
      font-size: 1rem;
      opacity: 0.55;
      padding: 20px 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Family Dashboard</h1>
    <div class="time" id="clock"></div>
  </div>

  <div class="calendars">
    <!-- Aksel's Calendar - loaded from Wilma ICS -->
    <div class="calendar-box">
      <h2>Aksel's Calendar</h2>
      <div id="aksel-events" class="events-list">
        <div class="note">Loading school schedule...</div>
      </div>
    </div>

    <!-- Ivar's Calendar - Google Calendar embed -->
    <div class="calendar-box">
      <h2>Ivar's Calendar</h2>
      <iframe src="https://calendar.google.com/calendar/embed?src=YOUR_IVAR_CALENDAR_ID%40group.calendar.google.com&ctz=Europe%2FHelsinki&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>
  </div>

  <div class="side">
    <div class="side-box">
      <h2>Weather – Laajasalo</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Bus – Stop 1491171</h2>
      <div class="departures" id="departures">
        <div class="note">Loading departures...</div>
      </div>
    </div>
  </div>

  <script>
    // ===== CLOCK =====
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fi-FI', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ===== WEATHER (Laajasalo) =====
    async function loadWeather() {
      const weatherEl = document.getElementById('weather');

      try {
        const url = 'https://api.open-meteo.com/v1/forecast' +
          '?latitude=60.1752' +
          '&longitude=25.0309' +
          '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m' +
          '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
          '&timezone=Europe%2FHelsinki' +
          '&forecast_days=4';

        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather API error');

        const data = await res.json();
        const current = data.current;
        const daily = data.daily;

        const temp = Math.round(current.temperature_2m);
        const feels = Math.round(current.apparent_temperature);
        const wind = Math.round(current.wind_speed_10m);
        const humidity = current.relative_humidity_2m;
        const code = current.weather_code;

        const weatherInfo = {
          0:  { desc: "Clear", icon: "☀️" },
          1:  { desc: "Mainly clear", icon: "🌤️" },
          2:  { desc: "Partly cloudy", icon: "⛅" },
          3:  { desc: "Overcast", icon: "☁️" },
          45: { desc: "Fog", icon: "🌫️" },
          48: { desc: "Fog", icon: "🌫️" },
          51: { desc: "Light drizzle", icon: "🌦️" },
          53: { desc: "Drizzle", icon: "🌦️" },
          55: { desc: "Dense drizzle", icon: "🌧️" },
          61: { desc: "Slight rain", icon: "🌧️" },
          63: { desc: "Rain", icon: "🌧️" },
          65: { desc: "Heavy rain", icon: "🌧️" },
          71: { desc: "Slight snow", icon: "🌨️" },
          73: { desc: "Snow", icon: "❄️" },
          75: { desc: "Heavy snow", icon: "❄️" },
          80: { desc: "Rain showers", icon: "🌦️" },
          81: { desc: "Showers", icon: "🌧️" },
          82: { desc: "Heavy showers", icon: "🌧️" },
          95: { desc: "Thunderstorm", icon: "⛈️" },
          96: { desc: "Thunderstorm", icon: "⛈️" }
        };

        const currentInfo = weatherInfo[code] || { desc: "Weather", icon: "🌡️" };

        let forecastHtml = '';
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        for (let i = 1; i <= 3; i++) {
          const date = new Date(daily.time[i] + 'T12:00:00');
          const dayName = days[date.getDay()];
          const max = Math.round(daily.temperature_2m_max[i]);
          const min = Math.round(daily.temperature_2m_min[i]);
          const dayCode = daily.weather_code[i];
          const info = weatherInfo[dayCode] || { desc: "", icon: "🌡️" };

          forecastHtml += `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #333;">
              <span style="width: 42px;">${dayName}</span>
              <span style="width: 32px; text-align: center; font-size: 1.25rem;">${info.icon}</span>
              <span style="flex: 1; opacity: 0.75; font-size: 0.95rem; padding-left: 6px;">${info.desc}</span>
              <span>${min}° / ${max}°</span>
            </div>
          `;
        }

        weatherEl.innerHTML = `
          <div class="temp">${temp}°</div>
          <div class="desc">${currentInfo.icon} ${currentInfo.desc}</div>
          <div style="margin-top: 12px; font-size: 1.05rem; opacity: 0.85; line-height: 1.5;">
            Feels like ${feels}° · Wind ${wind} km/h<br>
            Humidity ${humidity}%
          </div>
          <div style="margin-top: 16px; font-size: 0.95rem;">
            ${forecastHtml}
          </div>
        `;
      } catch (e) {
        console.error('Weather error:', e);
        weatherEl.innerHTML = `
          <div class="temp">--°</div>
          <div class="desc">Weather unavailable</div>
        `;
      }
    }

    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);

    // ===== AKSEL SCHOOL SCHEDULE (ICS) =====
    async function loadAkselSchedule() {
      const container = document.getElementById('aksel-events');
      const ICS_URL = 'https://yvkoulut.inschool.fi/schedule/export/students/167030/Wilma.ics?token=04167030xca951b62f2c0ffca02025635a42a812c&p=28&f=56&tstamp=1786682462';

      try {
        const res = await fetch(ICS_URL);
        if (!res.ok) throw new Error('Failed to fetch ICS');

        const text = await res.text();
        const events = parseICS(text);

        const now = new Date();
        const upcoming = events
          .filter(e => e.start >= now)
          .sort((a, b) => a.start - b.start)
          .slice(0, 8);

        if (upcoming.length === 0) {
          container.innerHTML = '<div class="note">No upcoming events</div>';
          return;
        }

        let html = '';
        upcoming.forEach(ev => {
          const timeStr = ev.start.toLocaleString('fi-FI', {
            weekday: 'short',
            day: 'numeric',
            month: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          html += `
            <div class="event-item">
              <div class="event-time">${timeStr}</div>
              <div class="event-title">${ev.summary}</div>
              ${ev.location ? `<div class="event-location">${ev.location}</div>` : ''}
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error('ICS error:', err);
        container.innerHTML = `
          <div class="note">
            Could not load school schedule<br>
            (possible CORS or expired token)
          </div>`;
      }
    }

    function parseICS(icsText) {
      const events = [];
      const blocks = icsText.split('BEGIN:VEVENT');

      for (let i = 1; i < blocks.length; i++) {
        const block = blocks[i];

        const summary = (block.match(/SUMMARY:(.*)/) || [])[1]?.trim() || 'Event';
        const location = (block.match(/LOCATION:(.*)/) || [])[1]?.trim() || '';
        const dtstart = (block.match(/DTSTART[^:]*:(.*)/) || [])[1]?.trim();

        if (!dtstart) continue;

        let start;
        if (dtstart.length === 8) {
          start = new Date(
            dtstart.slice(0,4),
            parseInt(dtstart.slice(4,6)) - 1,
            dtstart.slice(6,8)
          );
        } else {
          const cleaned = dtstart.replace('Z', '');
          start = new Date(
            cleaned.slice(0,4),
            parseInt(cleaned.slice(4,6)) - 1,
            cleaned.slice(6,8),
            cleaned.slice(9,11) || 0,
            cleaned.slice(11,13) || 0
          );
        }

        events.push({ summary, location, start });
      }

      return events;
    }

    loadAkselSchedule();
    setInterval(loadAkselSchedule, 15 * 60 * 1000);

    // ===== HSL DEPARTURES =====
    async function loadDepartures() {
      const container = document.getElementById('departures');
      const API_KEY = 'fb7596a828844a87933c2229abb55c31';

      const query = `
      {
        stop(id: "HSL:1491171") {
          name
          stoptimesWithoutPatterns(numberOfDepartures: 4) {
            realtime
            realtimeDeparture
            scheduledDeparture
            departureDelay
            serviceDay
            headsign
            trip {
              route {
                shortName
              }
            }
          }
        }
      }`;

      try {
        const res = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': API_KEY
          },
          body: JSON.stringify({ query })
        });

        const json = await res.json();

        if (json.errors) {
          console.error(json.errors);
          container.innerHTML = '<div class="note">API Error</div>';
          return;
        }

        const stoptimes = json.data?.stop?.stoptimesWithoutPatterns || [];

        if (stoptimes.length === 0) {
          container.innerHTML = '<div class="note">No upcoming departures</div>';
          return;
        }

        let html = '';

        stoptimes.forEach(st => {
          const departureSeconds = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          const absoluteTime = st.serviceDay + departureSeconds;

          const date = new Date(absoluteTime * 1000);
          let timeText = date.toLocaleTimeString('fi-FI', {
            hour: '2-digit',
            minute: '2-digit'
          });

          const delayMinutes = Math.round((st.departureDelay || 0) / 60);
          if (delayMinutes >= 1) {
            timeText += ` <span style="color:#ff6b6b; font-size:0.9rem;">(+${delayMinutes})</span>`;
          }

          const line = st.trip?.route?.shortName || '?';
          const dest = st.headsign || '';

          html += `
            <div class="departure">
              <span class="line">${line}</span>
              <span>${dest}</span>
              <span>${timeText}</span>
            </div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="note">Could not load departures</div>';
      }
    }

    loadDepartures();
    setInterval(loadDepartures, 60 * 1000);
  </script>
</body>
</html>
