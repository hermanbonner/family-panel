<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 2.1fr 0.9fr;
      gap: 14px;
      padding: 14px;
    }
    .calendars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .calendar-box, .side-box {
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .calendar-box h2, .side-box h2 {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .events-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 16px;
      font-size: 1.05rem;
    }
    .section-header {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #4fc3f7;
      margin: 16px 0 8px 0;
    }
    .section-header:first-child { margin-top: 4px; }
    .event-item {
      padding: 9px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .event-time {
      font-weight: 600;
      color: #4fc3f7;
      margin-bottom: 2px;
      font-size: 0.98rem;
    }
    .event-title { font-size: 1.05rem; }
    .event-location {
      font-size: 0.88rem;
      opacity: 0.65;
      margin-top: 2px;
    }
    .side {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .datetime {
      padding: 18px 16px;
      text-align: center;
    }
    .datetime .time {
      font-size: 3.0rem;
      font-weight: 300;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }
    .datetime .weekday {
      font-size: 1.3rem;
      margin-top: 8px;
      font-weight: 500;
    }
    .datetime .date {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-top: 2px;
    }
    .datetime .holiday {
      font-size: 0.95rem;
      color: #4fc3f7;
      margin-top: 8px;
      font-weight: 500;
    }
    .weather {
      padding: 16px 14px;
      text-align: center;
    }
    .weather .temp {
      font-size: 3.0rem;
      font-weight: 300;
    }
    .weather .desc {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-top: 6px;
    }
    .departures {
      flex: 1;
      padding: 12px 14px;
      overflow-y: auto;
      min-height: 0;
    }
    .departure {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 1.05rem;
    }
    .line {
      font-weight: 700;
      color: #4fc3f7;
      min-width: 38px;
    }
    .note {
      opacity: 0.55;
      padding: 8px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="calendars">
    <div class="calendar-box">
      <h2>Aksel's Calendar</h2>
      <div class="events-list" id="aksel-events">
        <div class="note">Loading...</div>
      </div>
    </div>
    <div class="calendar-box">
      <h2>Ivar's Calendar</h2>
      <div class="events-list" id="ivar-events">
        <div class="note">Loading...</div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="side-box">
      <div class="datetime">
        <div class="time" id="clock">--:--</div>
        <div class="weekday" id="weekday">--</div>
        <div class="date" id="date">--</div>
        <div class="holiday" id="holiday"></div>
      </div>
    </div>

    <div class="side-box">
      <h2>Weather – Laajasalo</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Bus – Stop 1491171</h2>
      <div class="departures" id="departures">
        <div class="note">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    // ===== HOLIDAYS =====
    const fixedHolidays = {
      "01-01": "New Year's Day",
      "01-06": "Epiphany",
      "02-05": "Runeberg Day",
      "02-28": "Kalevala Day",
      "03-19": "Minna Canth Day",
      "04-09": "Mikael Agricola Day",
      "04-27": "National Veterans' Day",
      "05-01": "May Day",
      "05-09": "Europe Day",
      "05-12": "J. V. Snellman Day",
      "06-04": "Defence Forces Flag Day",
      "07-06": "Eino Leino Day",
      "10-01": "Miina Sillanpää Day",
      "10-10": "Aleksis Kivi Day",
      "11-06": "Swedish Day",
      "12-06": "Independence Day",
      "12-08": "Jean Sibelius Day",
      "12-24": "Christmas Eve",
      "12-25": "Christmas Day",
      "12-26": "Boxing Day"
    };

    function getMovingHolidays(year) {
      const result = {};
      const formatKey = (d) => String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const addDays = (date, days) => {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
      };

      // Easter
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      const easter = new Date(year, month - 1, day);

      result[formatKey(addDays(easter, -2))] = "Good Friday";
      result[formatKey(easter)] = "Easter Sunday";
      result[formatKey(addDays(easter, 1))] = "Easter Monday";
      result[formatKey(addDays(easter, 39))] = "Ascension Day";
      result[formatKey(addDays(easter, 49))] = "Pentecost";

      // Mother's Day
      const may1 = new Date(year, 4, 1);
      const motherDay = new Date(year, 4, 1 + ((7 - may1.getDay()) % 7) + 7);
      result[formatKey(motherDay)] = "Mother's Day";

      // Father's Day
      const nov1 = new Date(year, 10, 1);
      const fatherDay = new Date(year, 10, 1 + ((7 - nov1.getDay()) % 7) + 7);
      result[formatKey(fatherDay)] = "Father's Day";

      // Midsummer
      for (let d = 20; d <= 26; d++) {
        const mid = new Date(year, 5, d);
        if (mid.getDay() === 6) {
          result[formatKey(mid)] = "Midsummer Day";
          result[formatKey(addDays(mid, -1))] = "Midsummer Eve";
          break;
        }
      }

      // Nature Day
      const aug31 = new Date(year, 7, 31);
      const natureDay = new Date(year, 7, 31 - ((aug31.getDay() + 1) % 7));
      result[formatKey(natureDay)] = "Finnish Nature Day";

      // All Saints' Day
      for (let d = 31; d <= 37; d++) {
        const check = new Date(year, 9, d);
        if (check.getDay() === 6) {
          result[formatKey(check)] = "All Saints' Day";
          break;
        }
      }
      return result;
    }

    function updateDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const key = String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

      document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      document.getElementById('weekday').textContent = now.toLocaleDateString('en-GB', { weekday: 'long' });
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', { month: 'long', day: 'numeric' });

      const allHolidays = Object.assign({}, fixedHolidays, getMovingHolidays(year));
      const holidayEl = document.getElementById('holiday');
      if (allHolidays[key]) {
        holidayEl.textContent = allHolidays[key];
        holidayEl.style.display = 'block';
      } else {
        holidayEl.textContent = '';
        holidayEl.style.display = 'none';
      }
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // ===== WEATHER (wind in m/s) =====
    async function loadWeather() {
      try {
        const res = await fetch(
          'https://api.open-meteo.com/v1/forecast' +
          '?latitude=60.1752&longitude=25.0309' +
          '&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature' +
          '&daily=temperature_2m_max,temperature_2m_min,weather_code,wind_speed_10m_max' +
          '&timezone=Europe%2FHelsinki&forecast_days=4'
        );
        const data = await res.json();

        const temp = Math.round(data.current.temperature_2m);
        const feels = Math.round(data.current.apparent_temperature);
        const wind = (data.current.wind_speed_10m / 3.6).toFixed(1); // m/s
        const humidity = data.current.relative_humidity_2m;
        const code = data.current.weather_code;

        const weatherMap = {
          0: { icon: "☀️", desc: "Clear" },
          1: { icon: "🌤️", desc: "Mainly clear" },
          2: { icon: "⛅", desc: "Partly cloudy" },
          3: { icon: "☁️", desc: "Overcast" },
          45: { icon: "🌫️", desc: "Fog" }, 48: { icon: "🌫️", desc: "Fog" },
          51: { icon: "🌦️", desc: "Light drizzle" }, 53: { icon: "🌦️", desc: "Drizzle" },
          61: { icon: "🌧️", desc: "Slight rain" }, 63: { icon: "🌧️", desc: "Rain" },
          71: { icon: "🌨️", desc: "Slight snow" }, 73: { icon: "❄️", desc: "Snow" },
          80: { icon: "🌦️", desc: "Rain showers" }, 95: { icon: "⛈️", desc: "Thunderstorm" }
        };

        const current = weatherMap[code] || { icon: "🌡️", desc: "Weather" };

        let forecast = '';
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        for (let i = 1; i <= 3; i++) {
          const d = new Date(data.daily.time[i]);
          const dayName = days[d.getDay()];
          const max = Math.round(data.daily.temperature_2m_max[i]);
          const min = Math.round(data.daily.temperature_2m_min[i]);
          const windMax = (data.daily.wind_speed_10m_max[i] / 3.6).toFixed(1); // m/s
          const dayInfo = weatherMap[data.daily.weather_code[i]] || { icon: "🌡️", desc: "" };

          forecast += `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #333;font-size:0.92rem;">
              <span style="width:36px;">${dayName}</span>
              <span style="font-size:1.2rem;width:30px;text-align:center;">${dayInfo.icon}</span>
              <span style="flex:1;opacity:0.8;padding-left:4px;font-size:0.88rem;">${dayInfo.desc}</span>
              <span style="text-align:right;line-height:1.3;">
                ${min}°/${max}°<br>
                <span style="opacity:0.7;font-size:0.82rem;">${windMax} m/s</span>
              </span>
            </div>`;
        }

        document.getElementById('weather').innerHTML = `
          <div class="temp">${temp}°</div>
          <div class="desc">${current.icon} ${current.desc}</div>
          <div style="margin-top:10px;font-size:0.95rem;opacity:0.85;line-height:1.45;">
            Feels ${feels}° · Wind ${wind} m/s<br>Humidity ${humidity}%
          </div>
          <div style="margin-top:12px;">${forecast}</div>
        `;
      } catch (e) {
        document.getElementById('weather').innerHTML = `<div class="temp">--°</div><div class="desc">Weather unavailable</div>`;
      }
    }
    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);

    // ===== ICS PARSER + CALENDARS =====
    function parseICS(text) {
      const events = [];
      const parts = text.split('BEGIN:VEVENT');
      for (let i = 1; i < parts.length; i++) {
        const b = parts[i];
        const summary = (b.match(/SUMMARY[^:]*:(.*)/) || [])[1]?.trim() || 'Event';
        const location = (b.match(/LOCATION[^:]*:(.*)/) || [])[1]?.trim() || '';
        const startStr = (b.match(/DTSTART[^:]*:(.*)/) || [])[1]?.trim();
        const endStr = (b.match(/DTEND[^:]*:(.*)/) || [])[1]?.trim();
        if (!startStr) continue;

        function toDate(s) {
          if (!s) return null;
          s = s.replace('Z', '');
          if (s.length === 8) return new Date(s.slice(0,4), parseInt(s.slice(4,6))-1, s.slice(6,8));
          return new Date(s.slice(0,4), parseInt(s.slice(4,6))-1, s.slice(6,8), s.slice(9,11)||0, s.slice(11,13)||0);
        }
        events.push({ summary, location, start: toDate(startStr), end: toDate(endStr) });
      }
      return events;
    }

    function fmt(d) {
      if (!d) return '';
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    async function loadChild(id, schoolUrl, soccerUrl) {
  const el = document.getElementById(id);
  try {
    const schoolRes = await fetch(schoolUrl);
    const school = parseICS(await schoolRes.text());

    let soccer = [];
    try {
      const proxy = 'https://corsproxy.io/?' + encodeURIComponent(soccerUrl);
      const sRes = await fetch(proxy);
      if (sRes.ok) soccer = parseICS(await sRes.text());
    } catch (e) {}

    const now = new Date();
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const today1 = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const tom1  = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2);

    // Helper: keep event only if it ended less than 1 hour ago (or hasn't ended yet)
    const stillRelevant = (e) => {
      const endTime = e.end ? e.end : e.start;           // fallback to start if no end
      const hideAfter = new Date(endTime.getTime() + 60 * 60 * 1000); // +1 hour
      return now < hideAfter;
    };

    // Today's events (only those that ended < 1h ago)
    const todaySchool = school
      .filter(e => e.start >= today0 && e.start < today1 && stillRelevant(e))
      .sort((a, b) => a.start - b.start);

    const todaySoccer = soccer
      .filter(e => e.start >= today0 && e.start < today1 && stillRelevant(e))
      .sort((a, b) => a.start - b.start);

    // Tomorrow's events (combined, earliest first)
    const tomorrowEvents = [
      ...school.filter(e => e.start >= today1 && e.start < tom1),
      ...soccer.filter(e => e.start >= today1 && e.start < tom1)
    ].sort((a, b) => a.start - b.start);

    let html = '';

    // School
    html += `<div class="section-header">School</div>`;
    if (todaySchool.length === 0) {
      html += `<div class="note">No more school today</div>`;
    } else {
      todaySchool.forEach(e => {
        const t = e.end ? `${fmt(e.start)} – ${fmt(e.end)}` : fmt(e.start);
        html += `<div class="event-item">
          <div class="event-time">${t}</div>
          <div class="event-title">${e.summary}</div>
          ${e.location ? `<div class="event-location">${e.location}</div>` : ''}
        </div>`;
      });
    }

    // Soccer
    html += `<div class="section-header">Soccer</div>`;
    if (todaySoccer.length === 0) {
      html += `<div class="note">No soccer today</div>`;
    } else {
      todaySoccer.forEach(e => {
        const t = e.end ? `${fmt(e.start)} – ${fmt(e.end)}` : fmt(e.start);
        html += `<div class="event-item">
          <div class="event-time">${t}</div>
          <div class="event-title">${e.summary}</div>
          ${e.location ? `<div class="event-location">${e.location}</div>` : ''}
        </div>`;
      });
    }

    // First Thing Tomorrow
    html += `<div class="section-header">First Thing Tomorrow</div>`;
    if (tomorrowEvents.length === 0) {
      html += `<div class="note">No activities scheduled.</div>`;
    } else {
      const e = tomorrowEvents[0];
      const t = e.end ? `${fmt(e.start)} – ${fmt(e.end)}` : fmt(e.start);
      html += `<div class="event-item">
        <div class="event-time">${t}</div>
        <div class="event-title">${e.summary}</div>
        ${e.location ? `<div class="event-location">${e.location}</div>` : ''}
      </div>`;
    }

    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div class="note">Could not load schedule</div>`;
  }
}

    const AKSEL_SCHOOL = 'https://yvkoulut.inschool.fi/schedule/export/students/167030/Wilma.ics?token=04167030xca951b62f2c0ffca02025635a42a812c&p=28&f=56&tstamp=1786682462';
    const AKSEL_SOCCER = 'https://id.myclub.fi/flow/calendar_subscriptions/46384.ics?token=1900f8ae39d12415a5d741d2a6d739d9edc271ad';
    const IVAR_SCHOOL  = 'https://helsinki.inschool.fi/schedule/export/students/629788/Wilma.ics?token=04629788xbfa1cd9f9404e2a8196048f4b00d04db&p=28&f=56&tstamp=1786682566';
    const IVAR_SOCCER  = 'https://id.myclub.fi/flow/calendar_subscriptions/46330.ics?token=d7f8d00e0516158b87fbe67a4f2916a961383c18';

    function refreshCalendars() {
      loadChild('aksel-events', AKSEL_SCHOOL, AKSEL_SOCCER);
      loadChild('ivar-events', IVAR_SCHOOL, IVAR_SOCCER);
    }
    refreshCalendars();
    setInterval(refreshCalendars, 15 * 60 * 1000);

    // ===== BUS =====
    async function loadBus() {
      try {
        const res = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': 'fb7596a828844a87933c2229abb55c31'
          },
          body: JSON.stringify({
            query: `{ stop(id: "HSL:1491171") { stoptimesWithoutPatterns(numberOfDepartures: 4) { realtime realtimeDeparture scheduledDeparture departureDelay serviceDay headsign trip { route { shortName } } } } }`
          })
        });
        const json = await res.json();
        const list = json.data?.stop?.stoptimesWithoutPatterns || [];

        if (list.length === 0) {
          document.getElementById('departures').innerHTML = '<div class="note">No departures</div>';
          return;
        }

        let html = '';
        list.forEach(st => {
          const secs = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          const time = new Date((st.serviceDay + secs) * 1000);
          let t = time.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
          const delay = Math.round((st.departureDelay || 0) / 60);
          if (delay >= 1) t += ` <span style="color:#ff6b6b">(+${delay})</span>`;

          html += `<div class="departure">
            <span class="line">${st.trip?.route?.shortName || '?'}</span>
            <span>${st.headsign || ''}</span>
            <span>${t}</span>
          </div>`;
        });
        document.getElementById('departures').innerHTML = html;
      } catch (e) {
        document.getElementById('departures').innerHTML = '<div class="note">Could not load bus</div>';
      }
    }
    loadBus();
    setInterval(loadBus, 60 * 1000);
  </script>
</body>
</html>
