<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 14px;
      padding: 14px;
    }
    .calendars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .calendar-box, .side-box {
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .calendar-box h2, .side-box h2 {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 16px;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .events-list {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .side {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .datetime {
      padding: 20px 16px;
      text-align: center;
    }
    .datetime .time {
      font-size: 3.2rem;
      font-weight: 300;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }
    .datetime .date {
      font-size: 1.25rem;
      opacity: 0.8;
      margin-top: 6px;
    }
    .weather {
      padding: 18px 16px;
      text-align: center;
    }
    .weather .temp {
      font-size: 3.2rem;
      font-weight: 300;
    }
    .weather .desc {
      font-size: 1.15rem;
      opacity: 0.8;
      margin-top: 6px;
    }
    .departures {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      min-height: 0;
    }
    .departure {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 1.1rem;
    }
    .line {
      font-weight: 700;
      color: #4fc3f7;
      min-width: 40px;
    }
    .note {
      opacity: 0.6;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <div class="calendars">
    <div class="calendar-box">
      <h2>Aksel's Calendar</h2>
      <div class="events-list" id="aksel-events">
        <div class="note">Calendars coming back soon...</div>
      </div>
    </div>
    <div class="calendar-box">
      <h2>Ivar's Calendar</h2>
      <div class="events-list" id="ivar-events">
        <div class="note">Calendars coming back soon...</div>
      </div>
    </div>
  </div>

  <div class="side">
    <!-- NEW: Time & Date module -->
    <div class="side-box">
      <div class="datetime" id="datetime">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="date">--</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Weather – Laajasalo</h2>
      <div class="weather" id="weather">
        <div class="temp">--°</div>
        <div class="desc">Loading...</div>
      </div>
    </div>

    <div class="side-box">
      <h2>Bus – Stop 1491171</h2>
      <div class="departures" id="departures">
        <div class="note">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    // TIME & DATE
    function updateDateTime() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fi-FI', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      document.getElementById('date').textContent = now.toLocaleDateString('fi-FI', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // WEATHER
    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=60.1752&longitude=25.0309&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FHelsinki&forecast_days=4');
        const data = await res.json();

        const temp = Math.round(data.current.temperature_2m);
        const feels = Math.round(data.current.apparent_temperature);
        const wind = Math.round(data.current.wind_speed_10m);
        const humidity = data.current.relative_humidity_2m;

        const codes = {
          0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
          45: "Fog", 61: "Rain", 63: "Rain", 80: "Showers", 95: "Thunderstorm"
        };

        let forecast = '';
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        for (let i = 1; i <= 3; i++) {
          const d = new Date(data.daily.time[i]);
          const day = days[d.getDay()];
          const max = Math.round(data.daily.temperature_2m_max[i]);
          const min = Math.round(data.daily.temperature_2m_min[i]);
          forecast += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333;font-size:0.95rem;">
            <span>${day}</span>
            <span>${codes[data.daily.weather_code[i]] || ''}</span>
            <span>${min}° / ${max}°</span>
          </div>`;
        }

        document.getElementById('weather').innerHTML = `
          <div class="temp">${temp}°</div>
          <div class="desc">${codes[data.current.weather_code] || 'Weather'}</div>
          <div style="margin-top:10px;font-size:1rem;opacity:0.85;">
            Feels ${feels}° · Wind ${wind} km/h<br>Humidity ${humidity}%
          </div>
          <div style="margin-top:12px;">${forecast}</div>
        `;
      } catch (e) {
        document.getElementById('weather').innerHTML = '<div class="temp">--°</div><div class="desc">Weather unavailable</div>';
      }
    }
    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);

    // BUS
    async function loadBus() {
      try {
        const res = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'digitransit-subscription-key': 'fb7596a828844a87933c2229abb55c31'
          },
          body: JSON.stringify({
            query: `{ stop(id: "HSL:1491171") { stoptimesWithoutPatterns(numberOfDepartures: 4) { realtime realtimeDeparture scheduledDeparture departureDelay serviceDay headsign trip { route { shortName } } } } }`
          })
        });

        const json = await res.json();
        const list = json.data?.stop?.stoptimesWithoutPatterns || [];

        if (list.length === 0) {
          document.getElementById('departures').innerHTML = '<div class="note">No departures</div>';
          return;
        }

        let html = '';
        list.forEach(st => {
          const secs = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          const time = new Date((st.serviceDay + secs) * 1000);
          let t = time.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
          const delay = Math.round((st.departureDelay || 0) / 60);
          if (delay >= 1) t += ` <span style="color:#ff6b6b">(+${delay})</span>`;

          html += `<div class="departure">
            <span class="line">${st.trip?.route?.shortName || '?'}</span>
            <span>${st.headsign || ''}</span>
            <span>${t}</span>
          </div>`;
        });

        document.getElementById('departures').innerHTML = html;
      } catch (e) {
        document.getElementById('departures').innerHTML = '<div class="note">Could not load bus</div>';
      }
    }
    loadBus();
    setInterval(loadBus, 60 * 1000);
  </script>
</body>
</html>
